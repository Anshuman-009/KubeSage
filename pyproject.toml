[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "poc-rtml-agent"
version = "0.1.0"
description = "Real-Time ML + RAG + LLM Alert Intelligence for Kubernetes Telemetry"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.7.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "xgboost>=2.0.0",
    "scikit-learn>=1.4.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "matplotlib>=3.8.0",
]

[tool.setuptools.packages.find]
include = ["shared*", "ml_training*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    ".",
    "poc-intelligence-app/backend",
    "mock-kube-telemetry-app",
]
